name: Supabase Keep-Alive Ping

on:
  schedule:
    # Runs every 3 days at 00:00 UTC to prevent Supabase free tier 7-day auto-pausing
    - cron: '0 0 */3 * *'
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Database
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -H "apikey: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJsZXBzaW1lenJmcGNwYmVqeWNlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE3MzM5MjEsImV4cCI6MjA4NzMwOTkyMX0.SANwCVFmXoP0y70k89djoY0tW2_H9kgDRsMyDyNUNpY" "https://rlepsimezrfpcpbejyce.supabase.co/rest/v1/firms?select=id&limit=1")
          echo "Supabase Ping Status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -eq 200 ] || [ "$HTTP_STATUS" -eq 206 ]; then
            echo "Supabase is active and healthy!"
          else
            echo "Warning: Ping returned HTTP status $HTTP_STATUS"
          fi
